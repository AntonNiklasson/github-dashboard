name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build, package and launch the desktop app
        run: pnpm test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-desktop-feedback
          path: |
            packages/harness/desktop-report/
            packages/harness/desktop-test-results/
          retention-days: 7
